<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPUB browser reader</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f4;color:#223238;font:16px 'DejaVu Sans',sans-serif}header{padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header a{color:#005a77}label{margin-left:auto}select{font:inherit}iframe{display:block;border:0;width:100%;height:calc(100vh - 60px);background:#fffdf8}
</style></head><body><header><strong>EPUB reader</strong><a href="EPUB/nav.xhtml" target="book">Contents</a><label>Text <select id="size"><option value="100">100%</option><option value="150">150%</option></select></label></header><iframe name="book" title="Book content" src="EPUB/chapter.xhtml"></iframe><script>
const frame=document.querySelector('iframe'), size=document.querySelector('#size');

</script></body></html>
